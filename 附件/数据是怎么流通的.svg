<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="650">
<rect width="1140" height="650" fill="#f8f9fa" rx="10"/>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#90a4ae"/></marker>
<marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#43a047"/></marker>
<linearGradient id="vd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef9a9a"/><stop offset="1" stop-color="#66bb6a"/></linearGradient>
</defs>
<text x="570" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">数据是怎么流通的 —— 一条增值链，不是物流链</text>
<text x="570" y="66" text-anchor="middle" font-size="13" fill="#666" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">实物靠运输，数据靠加工 —— 每一站都在增值，最后一站是决策</text>
<rect x="90" y="110" width="150" height="64" rx="9" fill="#5c6bc0"/>
<text x="165" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">① 产生</text>
<text x="165" y="157" text-anchor="middle" font-size="10.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">业务系统/埋点/日志</text>
<line x1="240" y1="142" x2="265" y2="142" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="265" y="110" width="150" height="64" rx="9" fill="#42a5f5"/>
<text x="340" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">② 采集</text>
<text x="340" y="157" text-anchor="middle" font-size="10.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">SDK/日志/同步</text>
<line x1="415" y1="142" x2="440" y2="142" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440" y="110" width="150" height="64" rx="9" fill="#29b6f6"/>
<text x="515" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">③ 传输</text>
<text x="515" y="157" text-anchor="middle" font-size="10.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">网络/消息队列</text>
<line x1="590" y1="142" x2="615" y2="142" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="615" y="110" width="150" height="64" rx="9" fill="#26a69a"/>
<text x="690" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">④ 加工 ETL</text>
<text x="690" y="157" text-anchor="middle" font-size="10.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">清洗/去重/口径统一</text>
<line x1="765" y1="142" x2="790" y2="142" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="790" y="110" width="150" height="64" rx="9" fill="#66bb6a"/>
<text x="865" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">⑤ 数仓分层</text>
<text x="865" y="157" text-anchor="middle" font-size="10.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">ODS→DWD→DWS→ADS</text>
<line x1="940" y1="142" x2="965" y2="142" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="965" y="110" width="150" height="64" rx="9" fill="#9ccc65"/>
<text x="1040" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">⑥ 消费应用</text>
<text x="1040" y="157" text-anchor="middle" font-size="10.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">报表/指标/模型</text>
<line x1="865" y1="174" x2="865" y2="208" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="880" y="200" font-size="10" fill="#888" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">展开</text>
<rect x="257" y="238" width="140" height="46" rx="7" fill="#ef9a9a"/>
<text x="327" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">ODS 原始层</text>
<text x="327" y="273" text-anchor="middle" font-size="9.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">原封不动</text>
<line x1="397" y1="261" x2="419" y2="261" stroke="#43a047" stroke-width="2" marker-end="url(#arrowG)"/>
<rect x="419" y="238" width="140" height="46" rx="7" fill="#ffb74d"/>
<text x="489" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">DWD 明细层</text>
<text x="489" y="273" text-anchor="middle" font-size="9.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">干净可用</text>
<line x1="559" y1="261" x2="581" y2="261" stroke="#43a047" stroke-width="2" marker-end="url(#arrowG)"/>
<rect x="581" y="238" width="140" height="46" rx="7" fill="#81c784"/>
<text x="651" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">DWS 汇总层</text>
<text x="651" y="273" text-anchor="middle" font-size="9.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">按主题汇总</text>
<line x1="721" y1="261" x2="743" y2="261" stroke="#43a047" stroke-width="2" marker-end="url(#arrowG)"/>
<rect x="743" y="238" width="140" height="46" rx="7" fill="#66bb6a"/>
<text x="813" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">ADS 应用层</text>
<text x="813" y="273" text-anchor="middle" font-size="9.5" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">直接出报表</text>
<rect x="257" y="300" width="626" height="14" rx="7" fill="url(#vd)"/>
<text x="257" y="330" font-size="11" fill="#777" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">价值密度：低（原始）</text>
<text x="883" y="330" text-anchor="end" font-size="11" fill="#777" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">高（直接可用）</text>
<text x="570" y="355" text-anchor="middle" font-size="12" fill="#555" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">越往下游越接近「能用」—— 天天写的 dws_eorder_xxx 就是 DWS 层的产物（原油 vs 成品油）</text>
<rect x="310" y="372" width="520" height="56" rx="9" fill="#ffa726"/>
<text x="570" y="394" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">⑦ 决策与行动</text>
<text x="570" y="414" text-anchor="middle" font-size="11" fill="#fff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">人看报表做决策 · 系统自动决策（风控/推荐/定价）</text>
<polyline points="1040,174 1040,372 830,372" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="570,428 570,475 40,475 40,142 90,142" fill="none" stroke="#ffa726" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
<text x="300" y="467" font-size="11" fill="#fb8c00" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">闭环：行动产生新数据 → 回到 ①，周而复始</text>
<text x="90" y="522" font-size="12.5" fill="#444" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">和实物商品的三点不同：① 复制零成本——给你一份我还有  ② 越加工越值钱——原始数据≠资产，指标才是  ③ 流通瓶颈不是物流，是信任/确权/隐私</text>
<text x="90" y="548" font-size="12.5" fill="#444" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">宏观：国家推「数据要素」市场化（数据交易中心）——本质是给「可无限复制的东西」人工建立稀缺性和产权</text>
<text x="90" y="600" font-size="15" font-weight="bold" fill="#333" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">金句：数据不是被运来运去的货物，是被越炼越纯的原油 —— 流通的每一步，都是增值的一步</text>
</svg>